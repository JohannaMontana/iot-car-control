<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control - IoT Carrito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/common.css" rel="stylesheet">
    <link href="css/control.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row mb-4">
            <div class="col text-center">
                <h1 class="gradient-text fw-bold">
                    <i class="fas fa-robot me-3"></i>IoT CAR CONTROL
                </h1>
                <p class="text-muted">
                    <span class="estado-conexion">
                        <span class="status-indicator status-offline"></span>
                        <span id="textoConexion">Conectando...</span>
                    </span>
                    <span class="mx-3">|</span>
                    <a href="monitoreo.html" class="text-decoration-none" style="color: var(--accent-pink);">
                        <i class="fas fa-chart-line me-1"></i>Panel de Monitoreo
                    </a>
                </p>
                <span id="estadoConexion" class="badge bg-secondary">
                    <i class="fas fa-robot me-1"></i>Estado Robot: Desconocido
                </span>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="glass-panel">
                    
                    <div class="mb-4 p-3 rounded border border-secondary bg-black bg-opacity-25 text-center">
                        <label class="text-light small mb-2 d-block">
                            <i class="fas fa-tachometer-alt me-1"></i>POTENCIA DEL MOTOR
                        </label>
                        <div class="btn-group w-100" role="group">
                            <input type="radio" class="btn-check" name="velocidad" id="velBaja" value="130" autocomplete="off">
                            <label class="btn btn-outline-success btn-sm" for="velBaja">Lenta (130)</label>

                            <input type="radio" class="btn-check" name="velocidad" id="velMedia" value="180" autocomplete="off" checked>
                            <label class="btn btn-outline-warning btn-sm" for="velMedia">Media (180)</label>

                            <input type="radio" class="btn-check" name="velocidad" id="velAlta" value="255" autocomplete="off">
                            <label class="btn btn-outline-danger btn-sm" for="velAlta">Turbo (255) 🔥</label>
                        </div>
                    </div>

                    <div class="control-grid mb-4">
                        <button class="control-btn btn-up-left" onclick="controlManager.moverCarrito(5)" title="Curva Izq Adelante">
                            <i class="fas fa-arrow-turn-up"></i>
                        </button>
                        <button class="control-btn btn-up" onclick="controlManager.moverCarrito(1)" title="Adelante">
                            <i class="fas fa-arrow-up"></i>
                        </button>
                        <button class="control-btn btn-up-right" onclick="controlManager.moverCarrito(4)" title="Curva Der Adelante">
                            <i class="fas fa-arrow-turn-up fa-flip-horizontal"></i>
                        </button>

                        <button class="control-btn btn-left" onclick="controlManager.moverCarrito(9)" title="Giro 90 Izq">
                            <i class="fas fa-rotate-left"></i>
                        </button>
                        <button class="control-btn btn-center" onclick="controlManager.detenerCarrito()" title="DETENER" 
                                style="background: linear-gradient(145deg, #ff4444, #cc0000); transform: scale(1.1);">
                            <i class="fas fa-stop"></i>
                        </button>
                        <button class="control-btn btn-right" onclick="controlManager.moverCarrito(8)" title="Giro 90 Der">
                            <i class="fas fa-rotate-right"></i>
                        </button>

                        <button class="control-btn btn-down-left" onclick="controlManager.moverCarrito(7)" title="Curva Izq Atrás">
                            <i class="fas fa-arrow-turn-down"></i>
                        </button>
                        <button class="control-btn btn-down" onclick="controlManager.moverCarrito(2)" title="Atrás">
                            <i class="fas fa-arrow-down"></i>
                        </button>
                        <button class="control-btn btn-down-right" onclick="controlManager.moverCarrito(6)" title="Curva Der Atrás">
                            <i class="fas fa-arrow-turn-down fa-flip-horizontal"></i>
                        </button>
                    </div>

                    <div class="row mt-3">
                        <div class="col-12">
                            <small class="text-muted mb-2 d-block text-center">Secuencias Automáticas (Demos):</small>
                            <div class="d-flex gap-2">
                                <button class="btn btn-sm flex-fill" onclick="demoManager.ejecutarCircuitoCuadrado()" 
                                        style="background: rgba(138, 43, 226, 0.3); color: white; border: 1px solid var(--accent-purple);">
                                    <i class="fas fa-square me-1"></i>Cuadrado
                                </button>
                                <button class="btn btn-sm flex-fill" onclick="demoManager.ejecutarZigZag()" 
                                        style="background: rgba(0, 255, 255, 0.3); color: white; border: 1px solid var(--accent-cyan);">
                                    <i class="fas fa-wave-square me-1"></i>Zig-Zag
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="row mt-3 g-2">
                        <div class="col-4">
                            <button class="btn btn-sm btn-outline-light w-100" onclick="controlManager.moverCarrito(11)">
                                <i class="fas fa-sync fa-flip-horizontal me-1"></i>360° Izq
                            </button>
                        </div>
                        <div class="col-4">
                            <button class="btn btn-sm btn-outline-light w-100" onclick="controlManager.moverCarrito(10)">
                                <i class="fas fa-sync me-1"></i>360° Der
                            </button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script src="js/demos.js"></script>
    <script src="js/control.js"></script>
</body>
</html>
