<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control - IoT Carrito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/common.css" rel="stylesheet">
    <link href="css/control.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row mb-4">
            <div class="col text-center">
                <h1 class="gradient-text fw-bold">
                    <i class="fas fa-robot me-3"></i>IoT CAR CONTROL
                </h1>
                <p class="text-muted">
                    <span class="estado-conexion">
                        <span class="status-indicator status-offline"></span>
                        <span id="textoConexion">Conectando...</span>
                    </span>
                    <span class="mx-3">|</span>
                    <a href="monitoreo.html" class="text-decoration-none" style="color: var(--accent-pink);">
                        <i class="fas fa-chart-line me-1"></i>Panel de Monitoreo
                    </a>
                </p>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-7 col-xl-6">
                <div class="glass-panel">
                    
                    <div class="mb-4 p-2 rounded border border-secondary bg-dark bg-opacity-25 text-center">
                        <label class="text-white small mb-2"><i class="fas fa-tachometer-alt me-2"></i>POTENCIA DEL MOTOR</label>
                        <div class="btn-group w-100" role="group">
                            <input type="radio" class="btn-check" name="velocidad" id="velBaja" value="130" autocomplete="off">
                            <label class="btn btn-outline-success btn-sm" for="velBaja">Lenta</label>

                            <input type="radio" class="btn-check" name="velocidad" id="velMedia" value="180" autocomplete="off" checked>
                            <label class="btn btn-outline-warning btn-sm" for="velMedia">Media</label>

                            <input type="radio" class="btn-check" name="velocidad" id="velAlta" value="255" autocomplete="off">
                            <label class="btn btn-outline-danger btn-sm" for="velAlta">Turbo 🔥</label>
                        </div>
                    </div>
                    
                    <div class="control-grid mb-4">
                        <button class="control-btn btn-up-left" onclick="controlManager.moverCarrito(5)"><i class="fas fa-arrow-turn-up"></i></button>
                        <button class="control-btn btn-up" onclick="controlManager.moverCarrito(1)"><i class="fas fa-arrow-up"></i></button>
                        <button class="control-btn btn-up-right" onclick="controlManager.moverCarrito(4)"><i class="fas fa-arrow-turn-up fa-flip-horizontal"></i></button>

                        <button class="control-btn btn-left" onclick="controlManager.moverCarrito(9)"><i class="fas fa-rotate-left"></i></button>
                        <button class="control-btn btn-center" onclick="controlManager.detenerCarrito()" style="background: linear-gradient(145deg, #ff4444, #cc0000); transform: scale(1.1);"><i class="fas fa-stop"></i></button>
                        <button class="control-btn btn-right" onclick="controlManager.moverCarrito(8)"><i class="fas fa-rotate-right"></i></button>

                        <button class="control-btn btn-down-left" onclick="controlManager.moverCarrito(7)"><i class="fas fa-arrow-turn-down"></i></button>
                        <button class="control-btn btn-down" onclick="controlManager.moverCarrito(2)"><i class="fas fa-arrow-down"></i></button>
                        <button class="control-btn btn-down-right" onclick="controlManager.moverCarrito(6)"><i class="fas fa-arrow-turn-down fa-flip-horizontal"></i></button>
                    </div>

                    <div class="row mt-3">
                        <div class="col-12">
                            <small class="text-muted mb-2 d-block text-center">Secuencias Automáticas:</small>
                            <div class="d-flex gap-2">
                                <button class="btn btn-sm flex-fill" onclick="demoManager.ejecutarCircuitoCuadrado()" 
                                        style="background: rgba(138, 43, 226, 0.3); color: white; border: 1px solid var(--accent-purple);">
                                    <i class="fas fa-square me-1"></i>Cuadrado
                                </button>
                                <button class="btn btn-sm flex-fill" onclick="demoManager.ejecutarZigZag()" 
                                        style="background: rgba(0, 255, 255, 0.3); color: white; border: 1px solid var(--accent-cyan);">
                                    <i class="fas fa-wave-square me-1"></i>Zig-Zag
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="row mt-2 g-2">
                        <div class="col-6">
                            <button class="btn btn-sm btn-outline-light w-100" onclick="controlManager.moverCarrito(11)"><i class="fas fa-sync fa-flip-horizontal me-1"></i>360° Izq</button>
                        </div>
                        <div class="col-6">
                            <button class="btn btn-sm btn-outline-light w-100" onclick="controlManager.moverCarrito(10)"><i class="fas fa-sync me-1"></i>360° Der</button>
                        </div>
                    </div>
                </div>

                <div class="glass-panel mb-4" id="editorDemo" style="display: none;">
                    <h4 class="mb-3"><i class="fas fa-edit me-2" style="color: var(--accent-cyan);"></i>Editor DEMO</h4>
                    <div class="row mb-3">
                        <div class="col-6"><input type="text" id="demoNombre" class="form-control" placeholder="Nombre"></div>
                        <div class="col-6"><input type="text" id="demoDescripcion" class="form-control" placeholder="Descripción"></div>
                    </div>
                    <div class="mb-3 p-3 border rounded bg-dark bg-opacity-25">
                        <label class="text-muted small mb-2">Agregar paso:</label>
                        <div class="input-group mb-2 input-group-sm">
                            <span class="input-group-text bg-secondary text-white">Duración (s)</span>
                            <input type="number" id="duracionMovimientoDemo" class="form-control bg-dark text-white" value="3" min="1">
                        </div>
                        <div class="btn-group w-100 flex-wrap">
                            <button class="btn btn-sm btn-outline-light" onclick="demoManager.agregarMovimiento(1)">⬆️</button>
                            <button class="btn btn-sm btn-outline-light" onclick="demoManager.agregarMovimiento(2)">⬇️</button>
                            <button class="btn btn-sm btn-outline-light" onclick="demoManager.agregarMovimiento(8)">↪️</button>
                            <button class="btn btn-sm btn-outline-light" onclick="demoManager.agregarMovimiento(9)">↩️</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="demoManager.agregarMovimiento(3)">🛑</button>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <div id="movimientosDemo" class="small text-muted">0 pasos</div>
                        <div class="btn-group">
                            <button class="btn btn-sm btn-danger" onclick="demoManager.ocultarEditor()">Cancelar</button>
                            <button class="btn btn-sm btn-success" onclick="demoManager.guardarDemo()">Guardar</button>
                        </div>
                    </div>
                </div>

                <div class="glass-panel">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="mb-0 text-white"><i class="fas fa-list me-2"></i>Mis Secuencias</h6>
                        <div class="btn-group">
                            <button class="btn btn-sm btn-outline-light" onclick="demoManager.cargarDemos()"><i class="fas fa-sync"></i></button>
                            <button class="btn btn-sm btn-info" onclick="demoManager.mostrarEditor()"><i class="fas fa-plus"></i></button>
                        </div>
                    </div>
                    <div id="listaDemos" class="small">Cargando...</div>
                </div>
            </div>

            <div class="col-lg-5 col-xl-4">
                
                <div class="glass-panel mb-4">
                    <h5 class="mb-3"><i class="fas fa-microchip me-2" style="color: var(--accent-purple);"></i>Estado</h5>
                    <ul class="list-group list-group-flush bg-transparent">
                        <li class="list-group-item bg-transparent text-white d-flex justify-content-between border-secondary">
                            <span>Conexión Web:</span>
                            <span id="estadoConexion" class="badge bg-secondary">Conectando...</span>
                        </li>
                        <li class="list-group-item bg-transparent text-white d-flex justify-content-between border-0">
                            <span>Estado Robot:</span>
                            <span id="robotEstado" class="fw-bold">-</span>
                        </li>
                    </ul>
                </div>

                <div class="glass-panel">
                    <h5 class="mb-3 text-white">
                        <i class="fas fa-history me-2" style="color: var(--accent-pink);"></i>
                        Historial (5)
                    </h5>
                    <div id="historialMovimientos" class="movement-history" style="min-height: 100px;">
                        <div class="text-center text-muted py-3">
                            <i class="fas fa-spinner fa-spin"></i> Cargando...
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script src="js/socket-handler.js"></script>
    <script src="js/demos.js"></script>
    <script src="js/control.js"></script>
</body>
</html>
